name: Build shop index
on:
  schedule:
    # 4 essais par heure : GitHub saute souvent des déclenchements programmés,
    # on vise ainsi au moins une mise à jour par heure en pratique.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p site && python build_index.py -o site/shop-index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # La publication échoue parfois côté GitHub ("No artifacts named github-pages were found") :
      # on réessaie une fois après 60 s. Le run (et l'e-mail d'échec) n'échoue que si les 2 essais ratent.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # GitHub désactive les tâches programmées d'un dépôt public sans activité depuis 60 jours.
  # Une fois tous les ~45 jours, on écrit la date dans .keepalive pour garder le dépôt actif.
  # (lancé aussi par le déclenchement horaire externe cron-job.org)
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "keepalive"
            git push
          fi
